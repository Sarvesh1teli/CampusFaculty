# Host Nginx for CampusFaculty; provision this domain certificate before enabling.
server { listen 80; server_name faculty.telicampus.in; return 301 https://$host$request_uri; }
server {
 listen 443 ssl;
 server_name faculty.telicampus.in;
 ssl_certificate /etc/letsencrypt/live/faculty.telicampus.in/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/faculty.telicampus.in/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 add_header Strict-Transport-Security "max-age=31536000" always;
 location / { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
